<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bougaa & Environ Market Place</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Montserrat:wght@700;800&display=swap">
<style>
:root{--b:#0B4FB8;--n:#083A8C;--l:#5FA2F5;--s:#9CC5FA;--bg:#F4F8FF;--t:#4A5B75;--br:#D6E4F7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',sans-serif;background:#DCE8F8;display:flex;justify-content:center;color:var(--n)}
button{font-family:inherit;cursor:pointer}
#app{width:100%;max-width:430px;height:100vh;height:100dvh;max-height:920px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;margin:auto 0;box-shadow:0 0 40px rgba(8,58,140,.18)}
#scr{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.btn{height:56px;border:0;border-radius:0;background:var(--b);color:#fff;font-size:17px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center}
.btn.o{background:#fff;color:var(--b);border:2px solid var(--b)}
.btn.sm{height:38px;font-size:14px}
.pill{font-family:Montserrat,sans-serif;font-weight:700;font-size:12px;background:#fff;color:var(--b);border-radius:8px;padding:2px 12px;line-height:1.3}
.pill.bl{background:var(--b);color:#fff}
.lock{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:Montserrat,sans-serif}
.lock b{font-weight:800;line-height:1.1}
.hd{background:var(--b);color:#fff;padding:14px 16px 36px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-radius:0 0 28px 28px;flex:none}
.ib{width:44px;height:44px;border:0;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:#fff}
.top{background:var(--b);color:#fff;height:60px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 12px;flex:none;font-weight:900;font-size:18px;text-align:center}
.card{background:#fff;border:1px solid var(--br);border-radius:16px;overflow:hidden}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border:0;background:none;color:var(--n);font-family:inherit}
.cat i{width:64px;height:64px;border-radius:50%;background:#fff;border:1px solid var(--br);display:flex;align-items:center;justify-content:center}
.cat.on i{background:var(--b);border:3px solid var(--s)}
.cat.on{color:var(--b);font-weight:900}
.nav{height:74px;background:#fff;border-top:1px solid var(--br);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 6px;flex:none}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--t);border:0;background:none;font-family:inherit;height:74px;justify-content:center}
.tb.on{color:var(--b);font-weight:900}
.bd{position:absolute;top:10px;left:calc(50% + 4px);min-width:16px;height:16px;background:var(--b);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
.dot{position:absolute;top:14px;left:calc(50% + 4px);width:10px;height:10px;border-radius:50%;background:var(--b);border:2px solid #fff}
.plus{width:32px;height:32px;background:var(--b);display:flex;align-items:center;justify-content:center;position:absolute;top:11px;left:50%;margin-left:-16px}
.tb.c{justify-content:flex-start;padding-top:43px;color:var(--b)}
input,select,textarea{text-align:center;text-align-last:center;width:100%;height:52px;border:1px solid var(--br);background:#fff;padding:0 14px;font:inherit;font-size:15px;color:var(--n);border-radius:0}
textarea{height:80px;padding:10px 14px}
label{font-size:13px;font-weight:700;color:var(--t);display:block;margin:12px 0 4px}
.row{display:flex;align-items:center;gap:12px}
.chip{padding:8px 16px;border:1px solid var(--br);background:#fff;font-weight:700;font-size:14px;color:var(--t)}
.chip.on{background:var(--b);color:#fff;border-color:var(--b)}
#gp{position:absolute;inset:0;z-index:45;display:none}#gp.o{display:block}#gp .bk{position:absolute;inset:0;background:rgba(8,58,140,.55)}#gp .sh{position:absolute;left:0;right:0;bottom:0;background:#fff;padding:14px 28px 28px;border-radius:28px 28px 0 0;box-shadow:0 -10px 30px rgba(8,58,140,.25);animation:f .25s}
#toast{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:50}
#toast.s{opacity:1}
#dr{position:absolute;inset:0;z-index:40;display:none}
#dr.o{display:block}
#dr .bk{position:absolute;inset:0;background:rgba(8,58,140,.55)}
#dr .pn{position:absolute;top:0;bottom:0;inset-inline-start:0;width:80%;background:#fff;display:flex;flex-direction:column;overflow-y:auto}
.mi{height:48px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid #EAF1FB;font-size:15.5px;font-weight:700;border-top:0;border-inline:0;background:none;font-family:inherit;color:var(--n);width:100%;text-align:start;flex:none}
.mi i{width:36px;height:36px;border-radius:50%;background:#EAF2FF;display:flex;align-items:center;justify-content:center;flex:none}
.fade{animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.q{display:flex;align-items:center;gap:0;border:1px solid var(--br);background:#fff}
.q button{width:34px;height:34px;border:0;background:none;font-size:20px;font-weight:900;color:var(--b)}
.q span{min-width:28px;text-align:center;font-weight:900}
@keyframes kb{0%{transform:scale(1)}100%{transform:scale(1.14) translateX(-8px)}}@keyframes fd{0%{opacity:1}40%{opacity:1}50%{opacity:0}90%{opacity:0}100%{opacity:1}}@keyframes lg{0%,100%{transform:translateY(0) rotate(0) scale(1);filter:drop-shadow(0 0 0 rgba(11,79,184,0))}25%{transform:translateY(-9px) rotate(-3deg) scale(1.04)}50%{transform:translateY(0) rotate(0) scale(1.07);filter:drop-shadow(0 10px 16px rgba(11,79,184,.38))}75%{transform:translateY(-9px) rotate(3deg) scale(1.04)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bmp{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2%)}}@keyframes spd{0%,100%{transform:translateX(0);opacity:1}50%{transform:translateX(-7%);opacity:.45}}@keyframes pop{0%{opacity:0;transform:translateY(-16px) scale(.85)}100%{opacity:1;transform:none}}@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(11,79,184,.45)}50%{box-shadow:0 0 0 14px rgba(11,79,184,0)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes shn{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sp .lock .pill{background:linear-gradient(110deg,#0B4FB8 35%,#4A90EA 50%,#0B4FB8 65%) 0 0/200% 100%;animation:rise .8s .3s both,shn 3.5s linear 1.2s infinite}.sp .tg{animation:rise .8s .5s both}.sp .pn svg{animation:bob 1.4s ease-in-out infinite}.sp .btn{animation:pls 2s ease-out infinite}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="app"><div id="scr"></div><div id="nv"></div><div id="dr"><div class="bk" onclick="drawer(0)"></div><div class="pn" id="dp"></div></div><div id="gp"></div><div id="toast"></div></div>
<script src="imgs.js"></script>
<script>
const I={lock:"M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3",key:"M14 10a4 4 0 1 0-3-3.8L3 14v4h4v-2h2v-2h2l1-1",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",mail:"M3 6h18v12H3zM3 7l9 7 9-7",shield:"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z",rest:"M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10",veg:"M12 7c-4 0-7 3-7 7s3 7 7 7 7-3 7-7-3-7-7-7zM12 7c0-2 1-4 3-4",groc:"M3 9h18l-2 11H5zM8 9l3-5M16 9l-3-5",cloth:"M8 3l-5 4 3 3 2-1v12h8V9l2 1 3-3-5-4a4 4 0 0 1-8 0z",phone:"M8 2h8a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM11 19h2",truck:"M3 15V9h11v6M14 11h4l3 3v1h-3M7 18a2 2 0 1 0 0-.01M17 18a2 2 0 1 0 0-.01",serv:"M14 6l4 4-9 9H5v-4zM13 7l4 4",more:"M5 12h.01M12 12h.01M19 12h.01",flame:"M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z",menu:"M4 6h16M4 12h16M4 18h16",user:"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6 8-6s8 2 8 6",bolt:"M13 2L4 14h7l-1 8 9-12h-7z",close:"M5 5l14 14M19 5L5 19",grid:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",cart:"M3 4h3l3 11h10l2-8H7M10 20h.01M18 20h.01",bell:"M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4",shop:"M4 9l1-5h14l1 5M4 9a2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0 2.5 2.5 0 0 0 5 0M5 12v8h14v-8",plus:"M12 5v14M5 12h14",back:"M9 5l7 7-7 7",search:"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4",pin:"M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11zM12 12a2 2 0 1 0 0-.01",box:"M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10",check:"M5 13l4 4L19 7",cam:"M4 8h4l2-3h4l2 3h4v11H4zM12 17a3.5 3.5 0 1 0 0-.01",out:"M9 4H5v16h4M16 8l4 4-4 4M20 12H9"};
const ic=(k,s=24,c='currentColor',w=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"><path d="${I[k]}"/></svg>`;
const T={ar:{},fr:{}};
const CATS=[['rest','مطاعم'],['veg','خضر وفواكه'],['groc','مواد غذائية'],['cloth','ملابس'],['phone','هواتف'],['truck','نقل وتوصيل'],['serv','خدمات'],['more','المزيد']];
const STORES=[
{id:1,cat:'groc',n:'مواد غذائية بوقاعة',r:4.8,bg:'#2E8B57',pos:'15%',p:[['زيت زيتون 1 لتر',650],['سميد 5 كغ',600],['حليب 1 لتر',90],['سكر 1 كغ',130]]},
{id:2,cat:'cloth',n:'ألبسة العائلة',r:4.6,bg:'#7A4FD6',pos:'50%',p:[['قميص رجالي',1800],['فستان',2900],['حذاء رياضي',3500]]},
{id:3,cat:'phone',n:'هاتف بوقاعة',r:4.7,bg:'#0B4FB8',pos:'85%',p:[['شاحن سريع',800],['سماعات',1500],['غطاء هاتف',450]]},
{id:4,cat:'rest',n:'مطعم الأصالة',r:4.5,bg:'#D97A1E',pos:'30%',p:[['بيتزا عائلية',900],['ساندويتش شاورما',350],['طاجين لحم',700]]},
{id:5,cat:'veg',n:'خضر وفواكه الحي',r:4.4,bg:'#3FA34D',pos:'70%',p:[['طماطم 1 كغ',80],['بطاطا 1 كغ',60],['تفاح 1 كغ',250],['برتقال 1 كغ',150]]}];
const S={scr:'splash',lang:'ar',cat:'groc',store:null,cart:{},orders:[],extra:[],sell:{cond:'جيد'},role:'client',ads:[],tab:'home',seen:false};
const $=s=>document.querySelector(s);
try{S.saved=JSON.parse(localStorage.getItem('bgmp_cred')||'null')}catch(e){S.saved=null}
const esc=s=>String(s==null?'':s).replace(/[&<>"'`]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
async function hp(p,u){if(!(window.crypto&&crypto.subtle))return null;const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('bgmp:'+u),iterations:100000,hash:'SHA-256'},k,256);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function persistCred(){try{localStorage.setItem('bgmp_cred',JSON.stringify(S.saved))}catch(e){}}
if(S.saved&&S.saved.p!==undefined){const o=S.saved;S.saved={u:o.u};try{localStorage.setItem('bgmp_cred',JSON.stringify(S.saved))}catch(e){}hp(o.p,o.u).then(h=>{if(h&&S.saved&&S.saved.u==o.u){S.saved.h=h;persistCred()}})}
function saveCred(u,p){S.saved={u};persistCred();hp(p,u).then(h=>{if(h&&S.saved&&S.saved.u==u){S.saved.h=h;persistCred()}})}
function clearCred(){S.saved=null;try{localStorage.removeItem('bgmp_cred')}catch(e){}}
function logout(){S.cart={};go('login',{guest:0});toast('تم تسجيل الخروج')}
async function doLogin(){const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p){toast('أدخل اسم المستخدم وكلمة السر');return}if(S.saved&&u==S.saved.u&&S.saved.h){const h=await hp(p,u);if(h&&h!==S.saved.h){toast('كلمة السر غير صحيحة');return}}if($('#lsv').checked)saveCred(u,p);else clearCred();go('home',{role:'client',guest:0});toast('أهلا بعودتك '+u+' ✓')}
function fpSend(){const v=$('#fc').value.trim(),ph=S.fp.m=='phone';if(ph?!okPh(v):!/^\S+@\S+\.\S+$/.test(v)){toast(ph?'أدخل رقم هاتف صحيح':'أدخل بريدًا إلكترونيًا صحيحًا');return}S.fp.c=v;S.fp.st=1;render();toast('تم إرسال الرمز ✓')}
function fpCode(){if($('#fk').value.trim()!='123456'){toast('الرمز غير صحيح');return}S.fp.st=2;render()}
function fpNew(){const a=$('#fn1').value,b=$('#fn2').value;if(a.length<6){toast('6 أحرف على الأقل');return}if(a!==b){toast('كلمتا السر غير متطابقتين');return}if(S.saved){saveCred(S.saved.u,a)}S.fp=null;go('login');toast('تم تغيير كلمة السر ✓ سجّل دخولك');}
const fmt=n=>'<bdi dir="ltr">'+n.toLocaleString('fr-FR').replace(/\s/g,' ')+'</bdi> دج';
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',1800)}
const GATED=['sell','notif','account','orders','ads'];
function gate(){const g=$('#gp');g.className='o';g.innerHTML=`<div class="bk" onclick="gate0()"></div><div class="sh"><div style="width:44px;height:5px;background:var(--br);border-radius:3px;margin:0 auto 18px"></div><div style="width:64px;height:64px;border-radius:50%;background:#EAF2FF;display:flex;align-items:center;justify-content:center;margin:0 auto">${ic('lock',32,'#0B4FB8')}</div><div style="text-align:center;font-size:21px;font-weight:900;margin-top:12px">سجّل حسابك للمتابعة</div><div style="text-align:center;font-size:14px;color:var(--t);margin:6px 0 18px;line-height:1.6">لإضافة المنتجات إلى السلة وإتمام الطلبات وحفظ مفضلتك، أنشئ حسابًا مجانيًا في ثوانٍ</div><div style="display:flex;flex-direction:column;gap:10px"><button class="btn" style="height:60px;font-size:20px;font-weight:900" onclick="gate0();go('regc',{role:'client',guest:0})">إنشاء حساب</button><button class="btn o" style="height:60px;font-size:20px;font-weight:900" onclick="gate0();go('login',{role:'client',guest:0})">تسجيل الدخول</button></div><div style="text-align:center;margin-top:14px;font-size:14px;font-weight:700;color:var(--t);cursor:pointer" onclick="gate0()">متابعة التصفح</div></div>`}
function gate0(){$('#gp').className=''}
function go(s,x){if(s=='done'&&!(x&&x.oid))S.oid=0;const g=x&&x.guest!==undefined?x.guest:S.guest;if(g&&GATED.includes(s)){gate();return}S.scr=s;Object.assign(S,x||{});drawer(0);render();$('#scr').scrollTop=0}
function drawer(o){$('#dr').className=o?'o':'';if(o)$('#dp').innerHTML=dp()}
const cnt=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const allP=()=>{const a=[];STORES.forEach(s=>[...s.p,...S.extra.filter(e=>e.s==s.id).map(e=>[e.n,e.p,e.img])].forEach((p,i)=>a.push({id:s.id+'-'+p[0],s,n:p[0],p:p[1],img:p[2]})));return a.filter(p=>!(S.hid||{})[p.id])};
const prod=id=>allP().find(p=>p.id==id);
const total=()=>Object.entries(S.cart).reduce((a,[id,q])=>a+(prod(id)?prod(id).p*q:0),0);
function add(id){if(S.guest){gate();return}S.cart[id]=(S.cart[id]||0)+1;toast('أُضيف إلى السلة ✓');renderNav();if(S.scr=='store')render()}
function qty(id,d){S.cart[id]=(S.cart[id]||0)+d;if(S.cart[id]<=0)delete S.cart[id];render()}
const lock=(w,nm,col)=>`<div class="lock" style="color:${col}"><img src="bougaa-logo-${col=='#fff'?'white':'blue'}.webp" style="width:${w}px;display:block"><b style="font-size:${esc(nm)}px">Bougaa &amp; Environ</b><span class="pill ${col=='#fff'?'':'bl'}" style="font-size:${nm*.7}px">Market Place</span></div>`;
const back=(to)=>`<button class="ib" onclick="go('${to}')" style="background:none"><span style="transform:scaleX(-1);display:flex">${ic('back',26,'#fff',2.4)}</span></button>`;
const topbar=(t,to,r='')=>`<div class="top">${back(to)}<span>${t}</span><span style="display:flex;justify-content:center">${r}</span></div>`;
function dp(){const it=[['shop','المتاجر','cats'],...CATS.slice(0,7).map(c=>[c[0],c[1],'cat:'+c[0]])];
return `<div style="height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--br);flex:none"><div class="row" style="gap:16px">${['ar:عربية','am:الأمازيغية','fr:Français'].map(x=>{const[a,b]=x.split(':');return `<span onclick="S.lang='${a}';dp0()" style="font-weight:${S.lang==a?900:700};color:${S.lang==a?'var(--b)':'var(--t)'};${S.lang==a?'border-bottom:3px solid var(--b)':''};cursor:pointer">${b}</span>`}).join('')}</div><span onclick="drawer(0)" style="cursor:pointer">${ic('close',26,'#083A8C',2.4)}</span></div>`+
it.map(([k,l,a],i)=>`<button class="mi" onclick="mn('${a}')" style="${i==0?'font-weight:900':''}"><i>${ic(k=='shop'?'shop':k,20,'#0B4FB8',1.9)}</i>${l}</button>`).join('')+
`<button class="mi" onclick="mn('used')"><i>${ic('tag',20,'#0B4FB8')}</i>سوق المستعمل</button><button class="mi" onclick="mn('orders')"><i>${ic('box',20,'#0B4FB8')}</i>طلباتي</button><button class="mi" onclick="mn('favs')"><i>${ic('heart',20,'#0B4FB8')}</i>المفضلة</button><button class="mi" onclick="mn('account')"><i>${ic('user',20,'#0B4FB8')}</i>حسابي</button><button class="mi" onclick="mn('help')"><i>${ic('help',20,'#0B4FB8')}</i>المساعدة</button><button class="mi" onclick="go('legal',{lt:0,lback:'home'})"><i>${ic('doc',20,'#0B4FB8')}</i>الشروط والخصوصية</button><button class="mi" onclick="mn('roles')"><i>${ic('out',20,'#0B4FB8')}</i>تبديل نوع الحساب</button><div style="padding:14px 18px 18px;margin-top:auto"><button class="btn o sm" style="height:46px" onclick="mn('regma')">سجّل متجرك</button><div style="text-align:center;margin-top:10px;font-size:12px;color:var(--t);cursor:pointer" onclick="mn('admin')">لوحة الإدارة (نموذج)</div></div>`}
function dp0(){$('#dp').innerHTML=dp();toast(S.lang=='ar'?'العربية':S.lang=='am'?'الأمازيغية (نموذج)':'Français (نموذج)')}
function mn(a){if(a.startsWith('cat:')){go('cat',{cat:a.slice(4)})}else go(a)}
function renderNav(){const n=$('#nv');const cs=['home','cat','cats','store','cart','notif','account','sell','used','ad','prod','favs','edit','set','help','orders','ads','track','legal','about'].includes(S.scr)&&S.role=='client';

function tp(id){const e=$('#'+id);e.type=e.type=='password'?'text':'password'}
function social(n){go('home',{role:'client',guest:0});toast('تم إنشاء حسابك تلقائيًا عبر '+n+' ✓')}
function regI(){if(!$('#fn').value.trim()||!$('#ln').value.trim()||!$('#ph2').value.trim()||!$('#ad2').value.trim()){toast('أكمل الاسم واللقب والهاتف والعنوان');return}S.userName=$('#fn').value.trim();go('home',{role:'client',guest:0});toast('أهلا '+S.userName+'، تم إنشاء حسابك ✓')}
function regC(){const u=$('#rn').value.trim(),p=$('#rw').value;if(!u||!p){toast('أدخل اسم المستخدم وكلمة السر');return}if(p!==$('#rw2').value){toast('كلمتا السر غير متطابقتين');return}if(!$('#tc').checked){toast('وافق على الشروط');return}if(!$('#rb').checked){toast('أكّد أنك لست روبوتًا');return}if($('#sv').checked)saveCred(u,p);go('regi',{role:'client',guest:0})}
function regM1(){S.shop=($('#sn').value||'').trim();if(!S.shop){toast('أدخل اسم المتجر');return}go('regm2')}
function regM2(){go('done',{msg:'تم إرسال طلب فتح متجرك',sub:'الإدارة تراجع متجرك وتفعّله قريبًا',back:'merchant'})}
function keep(){S.sell.t=($('#st')||{}).value;S.sell.p=($('#sp')||{}).value}
function srch(v){const r=$('#sr'),h=$('#hm');if(!v.trim()){r.innerHTML='';h.style.display='';return}h.style.display='none';const m=allP().filter(p=>p.n.includes(v)||p.s.n.includes(v));r.innerHTML=m.length?m.map(p=>`<div class="card row" style="padding:12px;margin-bottom:10px"><div style="flex:1"><b>${esc(p.n)}</b><div style="color:var(--t);font-size:12.5px">${esc(p.s.n)}</div><b style="color:var(--b)">${fmt(p.p)}</b></div><button class="btn sm" style="width:84px" onclick="add('${p.id}')">أضف</button></div>`).join(''):'<div style="text-align:center;color:var(--t);padding:30px">لا نتائج</div>'}
function order(){if(S.guest){gate();return}if(!okPh($('#ph').value)){toast(PHMSG);return}const id=100+S.orders.length+1;const items=Object.entries(S.cart).map(([k,q])=>prod(k).n+' × '+q).join('، ');S.orders.push({id,items,t:grand(),st:'جديد',ad:$('#ad').value||'بوقاعة'});S.cart={};S.promo='';S.cad=null;S.seen=0;simProg(id);go('done',{oid:id,msg:'تم إرسال طلبك #'+id,sub:'التاجر يحضّر طلبك والموصل في الطريق',back:'home'})}
function pub(){const t=$('#st').value.trim(),p=+$('#sp').value;if(!t||!p){toast('أدخل العنوان والسعر');return}S.ads.push({t,p,c:$('#sc').value,cond:S.sell.cond});S.sell={cond:'جيد'};go('done',{msg:'تم إرسال إعلانك',sub:'تتم مراجعته من الإدارة قبل نشره',back:'home'})}
